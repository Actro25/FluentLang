[workspace]
resolver = "3"

members = [
    "crates/fluentlang-cli",
    "crates/fluentlang-core",
    "crates/fluentlang-api"
]

[workspace.dependencies]
clap = {version = "4.6.6", features = ["derive"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
thiserror = "2.0.20"