[workspace]
resolver = "3"

members = [
    "crates/fluentlang-cli",
    "crates/fluentlang-core",
    "crates/fluentlang-api",
    "crates/fluentlang-printing"
]

[workspace.dependencies]
clap = {version = "4.6.6", features = ["derive"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
thiserror = "2.0.20"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
termimad = "0.35.5"
crossterm = "0.29.0"
terminal-colorsaurus = "1.0.3"
comfy-table = "8.0.1"